
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NatureShip - Login</title>
  <style>
    /* Same CSS as Signup */
    :root { --dark-bg: #121d18; --brand-green: #3be477; --white: #ffffff; --card: #1a2822; --border: #2d4138; }
    body { font-family: sans-serif; background: var(--dark-bg); color: var(--white); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .navbar { padding: 1rem 5%; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.5rem; font-weight: bold; text-decoration: none; }
    .logo .g { color: var(--brand-green); } .logo .w { color: var(--white); }
    .auth-page { flex: 1; display: flex; justify-content: center; align-items: center; }
    .card { background: var(--card); padding: 40px; border-radius: 15px; border: 1px solid var(--border); width: 100%; max-width: 350px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; background: #0d1612; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background: var(--brand-green); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .foot { margin-top: 15px; font-size: 0.9rem; color: #a0afaa; }
    .foot a { color: var(--brand-green); text-decoration: none; }
   

    body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;

  /* Background Image */
  background: url('/images/overhead-view-juicy-healthy-fruits-black-background.jpg') no-repeat center center/cover;
  height: 100vh;
}


  </style>
</head>
<body>
  <nav class="navbar"><a class="logo" href="#"><span class="g">Nature</span><span class="w">Ship</span>🌿</a></nav>
  <main class="auth-page">
    <div class="card">
      <h1>Welcome Back</h1>
      <form id="logForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="pass" placeholder="Password" required>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <p class="foot">New here? <a href="/projectsignup.html">Signup</a></p>
    </div>
  </main>
  <script>
    document.getElementById("logForm").onsubmit = function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const pass = document.getElementById("pass").value;
      const stored = JSON.parse(localStorage.getItem("natureShipUser"));
      if(stored && email === stored.email && pass === stored.pass) {
        alert("Login successful!");
        window.location.href = "ProjectAccount.html";
      } else {
        alert("Wrong email or password!");
      }
    };
  </script>
</body>
</html>
